name = "kakarot-ai"
compatibility_date = "2024-01-01"
main = "src/index.js"
account_id = "ae693ae9f4faf8d8202a61970309f150"
workers_dev = false

route = "kakarot-ai.cc.cd/*"

[[d1_databases]]
binding = "DB"
database_name = "kakarot-db"
database_id = "placeholder"

[[kv_namespaces]]
binding = "KV"
id = "placeholder"

[[r2_buckets]]
binding = "R2"
bucket_name = "kakarot-storage"

[[queues.producers]]
binding = "SUMMARY_QUEUE"
queue = "summary-generation"

[[queues.producers]]
binding = "EMAIL_QUEUE"
queue = "email-notifications"

[triggers]
crons = ["0 0 * * *", "0 0 1 * *"]

[env.production]
vars = { ENVIRONMENT = "production" }

[env.development]
vars = { ENVIRONMENT = "development" }