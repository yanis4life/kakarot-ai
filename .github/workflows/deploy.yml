name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create infrastructure
        run: |
          npx wrangler d1 create kakarot-db 2>/dev/null || echo "D1 kakarot-db already exists"
          npx wrangler queues create summary-generation 2>/dev/null || echo "Queue summary-generation already exists"
          npx wrangler queues create email-notifications 2>/dev/null || echo "Queue email-notifications already exists"
          npx wrangler r2 bucket create kakarot-storage 2>/dev/null || echo "R2 bucket kakarot-storage already exists"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Get D1 database ID
        id: d1
        run: |
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null | python3 -c "import sys,json; dbs=json.load(sys.stdin); print([d['uuid'] for d in dbs if d['name']=='kakarot-db'][0])" 2>/dev/null || echo "")
          echo "DB_ID=$DB_ID" >> $GITHUB_OUTPUT
          echo "Found D1 database ID: $DB_ID"

      - name: Update wrangler.toml with D1 ID
        run: |
          if [ -n "${{ steps.d1.outputs.DB_ID }}" ]; then
            sed -i "s/database_id = \"\"/database_id = \"${{ steps.d1.outputs.DB_ID }}\"/" wrangler.toml
            echo "Updated wrangler.toml with D1 database ID"
          fi
          cat wrangler.toml

      - name: Set secrets
        run: |
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET 2>/dev/null || echo "done"
          echo "${{ secrets.COOKIE_SECRET }}" | npx wrangler secret put COOKIE_SECRET 2>/dev/null || echo "done"
          echo "${{ secrets.CSRF_SECRET }}" | npx wrangler secret put CSRF_SECRET 2>/dev/null || echo "done"
          echo "${{ secrets.R2_ACCESS_KEY }}" | npx wrangler secret put R2_ACCESS_KEY 2>/dev/null || echo "done"
          echo "${{ secrets.R2_SECRET_KEY }}" | npx wrangler secret put R2_SECRET_KEY 2>/dev/null || echo "done"
          echo "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_ID 2>/dev/null || echo "done"
          echo "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET 2>/dev/null || echo "done"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

      - name: Initialize database schema
        run: |
          npx wrangler d1 execute kakarot-db --file=database/schema.js 2>/dev/null || echo "Schema initialization skipped"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}