name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create infrastructure
        run: |
          npx wrangler d1 create kakarot-db 2>/dev/null || true
          npx wrangler queues create summary-generation 2>/dev/null || true
          npx wrangler queues create email-notifications 2>/dev/null || true
          npx wrangler r2 bucket create kakarot-storage 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Set secrets
        run: |
          echo "${{ secrets.JWT_SECRET }}" | npx wrangler secret put JWT_SECRET 2>/dev/null || true
          echo "${{ secrets.COOKIE_SECRET }}" | npx wrangler secret put COOKIE_SECRET 2>/dev/null || true
          echo "${{ secrets.CSRF_SECRET }}" | npx wrangler secret put CSRF_SECRET 2>/dev/null || true
          echo "${{ secrets.R2_ACCESS_KEY }}" | npx wrangler secret put R2_ACCESS_KEY 2>/dev/null || true
          echo "${{ secrets.R2_SECRET_KEY }}" | npx wrangler secret put R2_SECRET_KEY 2>/dev/null || true
          echo "${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_ID 2>/dev/null || true
          echo "${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}" | npx wrangler secret put GOOGLE_OAUTH_CLIENT_SECRET 2>/dev/null || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy